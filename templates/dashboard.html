{% extends "base.html" %}


{% block content %}
<div style="
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
    padding: 2rem;
">
    <div style="
        background: #ffffff;
        padding: 3rem 4rem;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        max-width: 500px;
        width: 100%;
    ">
        <h2 style="
            font-size: 1.5rem;
            color: #1f2937;
            margin-bottom: 1rem;
            font-weight: 600;
        ">数据大屏</h2>
        <p style="
            color: #6b7280;
            margin-bottom: 2rem;
            line-height: 1.6;
        ">点击下方按钮，在新标签页打开数据大屏页面，查看完整分析内容。</p>
        
        <a 
            href="http://192.168.199.129:8100/#/de-link/34Oz42xw" 
            target="_blank"
            style="
                display: inline-block;
                padding: 14px 32px;
                background: linear-gradient(135deg, #007bff, #0056b3);
                color: #ffffff;
                border-radius: 8px;
                text-decoration: none;
                font-weight: 500;
                font-size: 1rem;
                box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
                transition: all 0.3s ease;
            "
            onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 16px rgba(0, 123, 255, 0.4)';"
            onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(0, 123, 255, 0.3)';"
        >
            开数据大屏
        </a>
    </div>
</div>
{% endblock %}
