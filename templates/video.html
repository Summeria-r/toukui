{% extends "base.html" %}
{% block title %}视频管理{% endblock %}
{% block content %}
<h3>视频列表</h3>
<table>
    <tr><th>ID</th><th>视频标题</th><th>视频地址</th><th>状态</th><th>创建时间</th></tr>
    {% for item in list %}
    <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.title }}</td>
        <td>{{ item.url }}</td>
        <td>{{ item.status }}</td>
        <td>{{ item.create_time }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
